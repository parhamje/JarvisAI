services:
  jarvis:
    build: .
    container_name: jarvis_247
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8765:8765"
    volumes:
      - ./config:/app/config
      - ./jarvis.session:/app/jarvis.session
      - ./brain:/app/brain
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
